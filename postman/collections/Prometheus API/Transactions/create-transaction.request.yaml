$kind: http-request
name: Create Transaction
method: POST
url: '{{base_url}}/api/trpc/transaction.create'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "type": "EXPENSE",
      "amount": "42.50",
      "accountId": "{{account_id}}",
      "categoryId": "{{category_id}}",
      "date": "2024-01-15T00:00:00.000Z",
      "description": "Weekly groceries"
    }
